name: Refresh Parliament snapshot

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Parliament is reachable
        continue-on-error: true
        run: |
          curl -sS -o /dev/null -D - --max-time 30 -A "Mozilla/5.0" \
            https://www.parliament.tas.gov.au/bills | head -15

      - name: Rebuild snapshot from Parliament
        run: python build_snapshot.py

      - name: Commit changes
        run: |
          git add -A snapshot
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh Parliament snapshot"
          git pull --rebase
          git push
