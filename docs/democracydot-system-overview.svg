<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">Democracydot system overview</title>
  <desc id="description">A high-level view of Democracydot: the GitHub repository deploys the static landing page to GitHub Pages and the Streamlit app to Streamlit Community Cloud. The GoDaddy-registered democracydot.com domain points to GitHub Pages. The landing page links to the app and Facebook and LinkedIn pages. The app uses Parliament of Tasmania records, OpenAI for requested AI features, and local SQLite or optional hosted Postgres storage.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 10 5 0 10z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 10 5 0 10z" fill="#3972c4"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #526176; }
      .section { font-size: 13px; font-weight: 700; letter-spacing: 1.4px; fill: #526176; }
      .card { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; }
      .primary { fill: #edf4ff; stroke: #3972c4; stroke-width: 2; }
      .domain { fill: #fff5fc; stroke: #d930a8; stroke-width: 2; }
      .repo { fill: #f0f4f8; stroke: #334155; stroke-width: 2; }
      .external { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .heading { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; fill: #405066; }
      .small { font-size: 12px; fill: #526176; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .deploy { fill: none; stroke: #3972c4; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .dashed { stroke-dasharray: 6 6; }
    </style>
  </defs>

  <rect width="1200" height="900" rx="20" fill="#f7f9ff"/>
  <text x="54" y="58" class="title">Democracydot — system overview</text>
  <text x="54" y="86" class="subtitle">From source code and public entry points to the civic app and its supporting services</text>

  <text x="54" y="130" class="section">PUBLIC ACCESS</text>
  <rect x="54" y="150" width="220" height="108" rx="14" class="external"/>
  <text x="76" y="184" class="heading">Constituents</text>
  <text x="76" y="210" class="body">Web browser or installed PWA</text>
  <text x="76" y="235" class="small">Open the site or follow a shared link</text>

  <rect x="350" y="142" width="250" height="124" rx="14" class="domain"/>
  <text x="374" y="178" class="heading">democracydot.com</text>
  <text x="374" y="204" class="body">Custom domain registered at GoDaddy</text>
  <text x="374" y="229" class="body">DNS points to GitHub Pages</text>
  <text x="374" y="250" class="small">HTTPS public landing site</text>

  <rect x="680" y="142" width="270" height="124" rx="14" class="primary"/>
  <text x="704" y="178" class="heading">GitHub Pages</text>
  <text x="704" y="204" class="body">Static site from repository /docs</text>
  <text x="704" y="229" class="body">Installable PWA + offline landing page</text>
  <text x="704" y="250" class="small">Main branch → Pages deployment</text>

  <path d="M274 204 H341" class="arrow"/>
  <path d="M600 204 H671" class="arrow"/>

  <rect x="1000" y="142" width="150" height="124" rx="14" class="external"/>
  <text x="1021" y="178" class="heading">Social pages</text>
  <text x="1021" y="205" class="body">Facebook</text>
  <text x="1021" y="230" class="body">LinkedIn</text>
  <text x="1021" y="250" class="small">Links from landing page</text>
  <path d="M950 204 H991" class="arrow dashed"/>

  <text x="54" y="322" class="section">SOURCE AND DEPLOYMENT</text>
  <rect x="54" y="346" width="300" height="142" rx="14" class="repo"/>
  <text x="80" y="382" class="heading">GitHub repository</text>
  <text x="80" y="409" class="body">mrogilvie/Democracydot.com</text>
  <text x="80" y="435" class="body">Application code, /docs site,</text>
  <text x="80" y="458" class="body">snapshot records and configuration</text>
  <text x="80" y="477" class="small">Pushes to main publish updates</text>

  <rect x="470" y="346" width="320" height="142" rx="14" class="primary"/>
  <text x="496" y="382" class="heading">Streamlit Community Cloud</text>
  <text x="496" y="409" class="body">Deploys app.py from the repository</text>
  <text x="496" y="435" class="body">Hosts the interactive Democracydot app</text>
  <text x="496" y="461" class="body">Secrets configured in deployment settings</text>

  <path d="M204 346 V302 H815 V276" class="deploy"/>
  <text x="427" y="294" class="small">/docs → GitHub Pages</text>
  <path d="M354 416 H461" class="deploy"/>
  <text x="371" y="401" class="small">app.py → deploy</text>
  <path d="M815 266 V326 H630 V336" class="arrow"/>
  <text x="826" y="306" class="small">Launch app</text>

  <text x="54" y="550" class="section">APP SERVICES AND DATA</text>
  <rect x="470" y="574" width="320" height="128" rx="14" class="primary"/>
  <text x="496" y="610" class="heading">Democracydot Streamlit app</text>
  <text x="496" y="637" class="body">Bill Information · Democratic Engagement</text>
  <text x="496" y="661" class="body">Democracy Index · Billbow feedback</text>
  <text x="496" y="686" class="small">Public Bill tools; owner review is protected</text>

  <rect x="54" y="574" width="300" height="128" rx="14" class="external"/>
  <text x="80" y="610" class="heading">Tasmanian Parliament</text>
  <text x="80" y="637" class="body">Bill records, documents and status</text>
  <text x="80" y="661" class="body">Hansard and e-petitions when available</text>
  <text x="80" y="686" class="small">Saved snapshot supports unavailable lookups</text>
  <path d="M461 638 H363" class="arrow"/>

  <rect x="906" y="574" width="244" height="128" rx="14" class="external"/>
  <text x="930" y="610" class="heading">OpenAI</text>
  <text x="930" y="637" class="body">gpt-4o-mini features</text>
  <text x="930" y="661" class="body">Used when an AI feature is requested</text>
  <text x="930" y="686" class="small">Key supplied through secrets or session</text>
  <path d="M799 638 H897" class="arrow"/>

  <rect x="250" y="758" width="700" height="94" rx="14" class="external"/>
  <text x="276" y="793" class="heading">Data storage</text>
  <text x="276" y="820" class="body">SQLite for local runs · Optional hosted Postgres for durable hosted comments and sign-ups</text>
  <text x="276" y="841" class="small">Private credentials and database connection strings belong in deployment secrets, not the repository.</text>
  <path d="M630 711 V749" class="arrow"/>

  <text x="54" y="875" class="small">Social media is an outbound discovery channel; it is not an integration with the app or a data service.</text>
</svg>
