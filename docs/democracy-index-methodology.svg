<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1200" viewBox="0 0 1400 1200" role="img" aria-labelledby="title description">
  <title id="title">How the Democracy Index is made</title>
  <desc id="description">A flow diagram showing how the introduced Bill and Act as passed are compared by AI for a 0 to 100 alignment estimate, while public discussion, Hansard, constituent comments, and related parliamentary e-petition signatures feed a separate process report. Petition signature bands are reported separately and do not change the alignment score. If no Act exists, the alignment score is omitted, but process findings are still produced.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 10 5 0 10z" fill="#7890aa"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 10 5 0 10z" fill="#4778d0"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #102a43; }
      .title { font-size: 34px; font-weight: 700; letter-spacing: -.5px; }
      .subtitle { font-size: 17px; fill: #5e7085; }
      .section { font-size: 14px; font-weight: 700; letter-spacing: 1.6px; fill: #4778d0; }
      .heading { font-size: 20px; font-weight: 700; }
      .body { font-size: 15px; fill: #40566d; }
      .small { font-size: 13px; fill: #5e7085; }
      .label { font-size: 12px; font-weight: 700; letter-spacing: 1px; }
      .inverse-heading { font-size: 21px; font-weight: 700; fill: #fff; }
      .inverse-blue { font-size: 16px; font-weight: 700; fill: #9fc2ff; }
      .inverse-pink { font-size: 16px; font-weight: 700; fill: #ff9be8; }
      .inverse-body { font-size: 14px; fill: #fff; }
      .card { fill: #fff; stroke: #d7e2ef; stroke-width: 1.5; }
      .blue { fill: #edf4ff; stroke: #4778d0; stroke-width: 2; }
      .pink { fill: #fff2fb; stroke: #e437bd; stroke-width: 2; }
      .gold { fill: #fff8e8; stroke: #e6b24b; stroke-width: 1.5; }
      .dark { fill: #102a43; }
      .arrow { fill: none; stroke: #7890aa; stroke-width: 2.5; marker-end: url(#arrow); }
      .blue-arrow { fill: none; stroke: #4778d0; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .rule { stroke: #e0e8f3; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1400" height="1200" rx="24" fill="#f7f9ff"/>
  <text x="64" y="66" class="title">How the Democracy Index is made</text>
  <text x="64" y="98" class="subtitle">Bill-to-Act alignment and democratic-process evidence are assessed separately.</text>

  <text x="64" y="151" class="section">01  /  BILL-TO-ACT ALIGNMENT</text>
  <rect x="64" y="174" width="290" height="170" rx="18" class="card"/>
  <circle cx="96" cy="210" r="15" fill="#edf4ff"/>
  <path d="M90 202h10l5 5v12H90zM100 202v5h5M93 212h9M93 216h9" fill="none" stroke="#4778d0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="122" y="216" class="heading">Bill as introduced</text>
  <text x="88" y="258" class="body">Official Parliament Bill text</text>
  <text x="88" y="285" class="small">Starting proposal and purpose</text>
  <text x="88" y="315" class="small">Required for the comparison</text>

  <rect x="382" y="174" width="290" height="170" rx="18" class="card"/>
  <circle cx="414" cy="210" r="15" fill="#edf4ff"/>
  <path d="M408 202h10l5 5v12h-15zM418 202v5h5M411 212h9M411 216h9" fill="none" stroke="#4778d0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="440" y="216" class="heading">Act as passed</text>
  <text x="406" y="258" class="body">Official final Act text</text>
  <text x="406" y="285" class="small">Shows the law after Parliament</text>
  <text x="406" y="315" class="small">May not exist while Bill is in progress</text>

  <path d="M354 259h45" class="blue-arrow"/>
  <path d="M672 259h42" class="blue-arrow"/>
  <rect x="722" y="174" width="614" height="170" rx="18" class="blue"/>
  <text x="750" y="210" class="label" fill="#4778d0">AI DOCUMENT COMPARISON</text>
  <text x="750" y="245" class="heading">Estimate substantive alignment</text>
  <text x="750" y="275" class="body">Does the Act preserve the Bill's purpose and material provisions?</text>
  <text x="750" y="302" class="small">Formatting, renumbering and minor wording changes do not dominate.</text>
  <rect x="1172" y="190" width="136" height="40" rx="20" fill="#fff"/>
  <text x="1240" y="216" text-anchor="middle" class="label" fill="#4778d0">0–100 ESTIMATE</text>

  <rect x="64" y="365" width="1272" height="52" rx="14" class="gold"/>
  <path d="M90 382v17m-7-8 7 8 7-8" fill="none" stroke="#b37a13" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="116" y="397" class="body" font-weight="700">Decision:</text>
  <text x="190" y="397" class="body">If there is no Act yet, omit the alignment score; continue with the process report.</text>

  <text x="64" y="474" class="section">02  /  DEMOCRATIC-PROCESS EVIDENCE</text>
  <rect x="64" y="497" width="290" height="162" rx="18" class="card"/>
  <circle cx="96" cy="532" r="15" fill="#fff2fb"/>
  <path d="M88 528h16v10H94l-5 4v-4h-1zM92 532h8M92 535h5" fill="none" stroke="#d930a8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="122" y="538" class="heading">Public discussion</text>
  <text x="88" y="579" class="body">Web search for news and</text>
  <text x="88" y="601" class="body">publicly visible social posts</text>
  <text x="88" y="634" class="small">Arguments, tone and stakeholders</text>

  <rect x="382" y="497" width="290" height="162" rx="18" class="card"/>
  <circle cx="414" cy="532" r="15" fill="#edf4ff"/>
  <path d="M405 526h18v13h-18zM409 530h10M409 534h7M409 537h9" fill="none" stroke="#4778d0" stroke-width="1.6" stroke-linecap="round"/>
  <text x="440" y="538" class="heading">Hansard debates</text>
  <text x="406" y="579" class="body">Debate text from both houses</text>
  <text x="406" y="607" class="small">Sittings found and debate summaries</text>
  <text x="406" y="634" class="small">Absence of records is noted</text>

  <rect x="700" y="497" width="290" height="162" rx="18" class="card"/>
  <circle cx="732" cy="532" r="15" fill="#edf4ff"/>
  <circle cx="729" cy="529" r="3" fill="none" stroke="#4778d0" stroke-width="1.6"/>
  <circle cx="736" cy="530" r="2.5" fill="none" stroke="#4778d0" stroke-width="1.6"/>
  <path d="M723 539c1-5 11-5 12 0M733 538c1-4 8-4 9 0" fill="none" stroke="#4778d0" stroke-width="1.6" stroke-linecap="round"/>
  <text x="758" y="538" class="heading">Constituent comments</text>
  <text x="724" y="579" class="body">Billbow comments received</text>
  <text x="724" y="607" class="small">Count matched to this Bill</text>
  <text x="724" y="634" class="small">Local app engagement evidence</text>

  <rect x="1018" y="497" width="318" height="162" rx="18" class="pink"/>
  <circle cx="1050" cy="532" r="15" fill="#fff"/>
  <path d="M1042 525h16v14h-16zM1045 529h10M1045 532h10M1045 535h6" fill="none" stroke="#d930a8" stroke-width="1.6" stroke-linecap="round"/>
  <text x="1076" y="538" class="heading">Related e-petitions</text>
  <text x="1042" y="579" class="body">Matched Parliament petitions</text>
  <text x="1042" y="607" class="small">Signature totals indicate interest,</text>
  <text x="1042" y="630" class="small">not a poll; paper petitions excluded</text>

  <path d="M209 659v23M527 659v23M845 659v23M1177 659v23M209 682h968" fill="none" stroke="#7890aa" stroke-width="2.5"/>
  <path d="M436 682v18" class="arrow"/>
  <path d="M1177 682v16h-93v2" class="arrow"/>
  <rect x="64" y="708" width="744" height="176" rx="18" class="blue"/>
  <text x="94" y="746" class="label" fill="#4778d0">AI PROCESS ANALYSIS</text>
  <text x="94" y="781" class="heading">Summarise how the process is working</text>
  <text x="94" y="813" class="body">Synthesises public discussion, Hansard, comments and petition evidence.</text>
  <text x="94" y="842" class="small">Reports engagement, key arguments and changes; notes evidence limits.</text>
  <text x="94" y="866" class="small">If the Bill is not yet an Act, describes the process as still under way.</text>

  <rect x="832" y="708" width="504" height="176" rx="18" class="pink"/>
  <text x="862" y="746" class="label" fill="#d930a8">SEPARATE PETITION-SIGNATURE BAND</text>
  <text x="862" y="781" class="heading">Deterministic total-signature band</text>
  <text x="862" y="814" class="body">0 = none  ·  1–99 = limited  ·  100–999 = moderate</text>
  <text x="862" y="841" class="body">1,000–4,999 = high  ·  5,000+ = very high</text>
  <text x="862" y="869" class="small">Displayed as democratic importance; not added to the 0–100 score.</text>

  <path d="M436 884v102" class="blue-arrow"/>
  <path d="M1084 884v102" class="blue-arrow"/>
  <text x="64" y="970" class="section">03  /  INDEX REPORT</text>
  <rect x="64" y="993" width="1272" height="154" rx="20" class="dark"/>
  <text x="96" y="1033" class="inverse-heading">Democracy Index report</text>
  <line x1="690" y1="1020" x2="690" y2="1122" stroke="#46627f" stroke-width="1.5"/>
  <text x="96" y="1073" class="inverse-blue">ALIGNMENT (when an Act exists)</text>
  <text x="96" y="1102" class="inverse-body">0–100 estimate · comparison summary · changed areas · evidence note</text>
  <text x="730" y="1073" class="inverse-pink">PROCESS &amp; ENGAGEMENT</text>
  <text x="730" y="1102" class="inverse-body">Public discussion · debates · process analysis · petition total and band</text>
  <text x="64" y="1180" class="small">AI-assisted estimate, not an official parliamentary rating, measure of democratic legitimacy, or legal advice.</text>
</svg>
