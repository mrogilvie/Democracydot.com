<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  .tile {
    width: 720px; height: 720px;
    display: flex; align-items: center; justify-content: center;
    background: #102a43;
  }
  .bars { display: flex; align-items: flex-end; gap: 28px; height: 320px; }
  .bars span { display: block; width: 78px; border-radius: 39px; }
  .bars span:nth-child(1) { height: 185px; background: #6495ed; }
  .bars span:nth-child(2) { height: 320px; background: #ff38d1; }
  .bars span:nth-child(3) { height: 250px; background: #fff; }
</style>
</head>
<body>
  <div class="tile"><div class="bars"><span></span><span></span><span></span></div></div>
</body>
</html>
